<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - CampoFácil</title><link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
    <div class="login-logo">🌱</div>
    <h1>CampoFácil</h1>
    <p>Organização financeira e documental do produtor rural.</p>
    {% if form.errors %}<div class="erro">Usuário ou senha incorretos.</div>{% endif %}
    <form method="post">{% csrf_token %}
        <label>Usuário</label>{{ form.username }}
        <label>Senha</label>{{ form.password }}
        <button class="btn primary full">Entrar</button>
    </form>
</div>
</body>
</html>
